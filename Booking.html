<html>
    <head>
        <title>Booking</title>
    </head>
    <style>
 body{
            background: gray;
            margin: 0;
            padding: 0;
        }
        h1{
            color: white;
            padding: 10px;
            margin-right: 50px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 45px;

            
        }

        header{

            
            background: gray;
        }
        .navbar{
    display: flex;
    align-items: center;
    position: sticky;
}

.nav-links{
    
    
    display: flex;
    gap: 35px;
   
   
    
}

.nav-links a{
    
    text-decoration: none;
    color: rgb(255, 255, 255);
   
    
    font-size: 20px;
    font-family: Arial, Helvetica, sans-serif;
}

.nav-links a:hover{
    color: #fff;
    background-color: black;
    padding: 5px;
}
        .booking {
    min-height: 100vh;
    background: #f5f3ef;
    padding: 90px 7%;
    font-family: Arial, sans-serif;
}


/* HEADER */

.booking-header {
    text-align: center;
    margin-bottom: 50px;
}

.booking-header p {
    font-size: 13px;
    letter-spacing: 3px;
    color: #777;
}

.booking-header h1 {
    font-family: Georgia, serif;
    font-size: 55px;
    font-weight: normal;
    color: #222;
    margin: 15px 0;
}

.booking-header span {
    color: #666;
    font-size: 17px;
}


/* BOOKING BOX */

.booking-box {
    max-width: 750px;
    margin: auto;

    background: white;

    padding: 50px;

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}


/* FORM ROW */

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}


/* FORM */

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;

    padding: 15px;

    border: 1px solid #ccc;

    background: #fafafa;

    font-family: Arial, sans-serif;
    font-size: 15px;

    outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #222;
}


/* BUTTON */

.booking-btn {
    width: 100%;

    padding: 18px;

    border: none;

    background: #050505;
    color: white;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.3s;
}

.booking-btn:hover {
    background: #333;
}


/* MOBILE */

@media (max-width: 600px) {

    .booking {
        padding: 60px 5%;
    }

    .booking-header h1 {
        font-size: 40px;
    }

    .booking-box {
        padding: 30px 20px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
    </style>
    <body>

          <header>
                       <nav class="navbar">
                
                    <h1>ROYAL CREST SUITS & HOTEL</h1>
                

                <ul class="nav-links">
                   <a href="index.html">Home</a>
                   <a href="Our Rooms.html">Our Rooms</a>
                   <a href="Contact.html">Contact</a>
                   <a href="Booking.html">Booking</a>
                </ul>
            </nav>

        </header>
        <section class="booking">

    <div class="booking-header">
        <p>Royal Crest HOTEL</p>
        <h1>Book your room</h1>
        <span>Make your reservation and enjoy your stay with us.</span>
    </div>

    <div class="booking-box">

        <form>

            <div class="form-group">
                <label>Choose a room</label>

                <select>
                    <option value="">Select room</option>
                    <option>Deluxe Room</option>
                    <option>Superior Room</option>
                    <option>Family Room</option>
                    <option>Harbour View Room</option>
                </select>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Check-in</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Check-out</label>
                    <input type="date">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Adults</label>

                    <select>
                        <option>1 Adult</option>
                        <option>2 Adults</option>
                        <option>3 Adults</option>
                        <option>4 Adults</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Children</label>

                    <select>
                        <option>0 Children</option>
                        <option>1 Child</option>
                        <option>2 Children</option>
                        <option>3 Children</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Full name</label>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Phone number</label>
                <input type="tel" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label>Special request</label>
                <textarea
                    rows="4"
                    placeholder="Any special requests?">
                </textarea>
            </div>

            <button type="submit" class="booking-btn">
                Book your room now
            </button>

        </form>

    </div>

</section>
    </body>
</html>
